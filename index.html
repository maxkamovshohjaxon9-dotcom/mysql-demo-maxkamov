<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySQL demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input { padding: 8px; width: 60%; }
    button { padding: 8px 14px; }
    li { margin: 6px 0; }
    small { color: #666; }
    #status { min-height: 1.2em; font-size: 14px; }
    #status.error { color: #b00020; }
    #status.ok { color: #1b7f3b; }
  </style>
</head>
<body>
  <h1>Ismingizni qoldiring</h1>
  <input id="name" placeholder="Ism" maxlength="100">
  <button id="save" onclick="add()">Saqlash</button>
  <p id="status" role="status"></p>
  <ul id="list"></ul>

<script>
const API = "/.netlify/functions/api";

function setStatus(text, kind) {
  const el = document.getElementById("status");
  el.textContent = text || "";
  el.className = kind || "";
}

function render(rows) {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  rows.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.name + " ";
    const s = document.createElement("small");
    s.textContent = "(" + new Date(r.created_at).toLocaleString() + ")";
    li.appendChild(s);
    ul.appendChild(li);
  });
}

async function load() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Yuklashda xatolik");
    render(data);
  } catch (e) {
    setStatus("Ro'yxatni yuklab bo'lmadi: " + e.message, "error");
  }
}

async function add() {
  const input = document.getElementById("name");
  const button = document.getElementById("save");
  const name = input.value.trim();
  if (!name) {
    setStatus("Iltimos, ism kiriting", "error");
    input.focus();
    return;
  }
  button.disabled = true;
  setStatus("Saqlanmoqda...");
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Saqlashda xatolik");
    render(data);
    input.value = "";
    setStatus("Saqlandi ✓", "ok");
  } catch (e) {
    setStatus("Saqlab bo'lmadi: " + e.message, "error");
  } finally {
    button.disabled = false;
    input.focus();
  }
}

document.getElementById("name").addEventListener("keydown", e => {
  if (e.key === "Enter") add();
});

load();
</script>
</body>
</html>
